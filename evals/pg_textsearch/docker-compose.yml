services:
  postgres:
    build:
      context: .
      args:
        POSTGRES_IMAGE: ${SAGE_PG_TEXTSEARCH_IMAGE:-pgvector/pgvector:pg17}
    image: sage-pg-textsearch-eval:1.3.1-pg17
    container_name: sage-pg-textsearch-eval
    environment:
      POSTGRES_USER: sage_eval
      POSTGRES_PASSWORD: sage_eval_dev
      POSTGRES_DB: sage_eval
    ports:
      - "${SAGE_PG_TEXTSEARCH_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage_eval -d sage_eval"]
      interval: 2s
      timeout: 3s
      retries: 30
