[package]
name = "sage-desktop"
version = "0.1.0"
description = "Sage secure desktop host"
edition = "2021"
rust-version = "1.98"

[lib]
name = "sage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }
tauri-codegen = "=2.5.5"
tauri-plugin = { version = "=2.5.4", features = ["build"] }
tauri-utils = "=2.8.3"

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.184"
rand = "=0.9.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sysinfo = "=0.37.2"
tauri = { version = "=2.10.3", features = [] }
tauri-macros = "=2.5.5"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-runtime = "=2.10.1"
tauri-runtime-wry = "=2.10.1"
tauri-utils = "=2.8.3"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["time"] }
uuid = { version = "=1.23.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
security-framework = "=3.7.0"

[dev-dependencies]
tempfile = "=3.27.0"
