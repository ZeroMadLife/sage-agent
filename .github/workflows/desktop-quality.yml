name: Desktop Quality

on:
  pull_request:
  push:
    branches:
      - main
      - dev/sage-v7

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci --prefix frontend

      - name: Verify Python desktop contracts
        run: |
          python -m pytest tests/desktop -q --tb=short
          python -m ruff check desktop tests/desktop
          python -m mypy desktop

      - name: Verify frontend recovery contracts
        working-directory: frontend
        run: |
          npm run test -- --run src/desktop/hostAdapter.test.ts src/components/desktop/DesktopHostGate.test.ts
          npm run build
          npm run desktop:launcher

      - name: Verify Rust host contracts
        working-directory: frontend/src-tauri
        env:
          SAGE_BUILD_SHA: ${{ github.sha }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Build and smoke the clean desktop bundle
        run: python -m desktop.bundle --output-dir "$RUNNER_TEMP/sage-desktop-${GITHUB_SHA}"

      - name: Verify no desktop processes remain
        run: |
          ! pgrep -x sage-desktop
          ! pgrep -f 'sage-api-aarch64-apple-darwin.*--desktop-host'

      - uses: actions/upload-artifact@v4
        with:
          name: sage-desktop-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/sage-desktop-${{ github.sha }}/desktop-bundle-receipt.json
          if-no-files-found: error
